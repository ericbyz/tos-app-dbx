# TOS platform nginx include — maps the /dbx/ route to the local dbx-web port.
# Location-block only (server{} is forbidden by the TOS spec, guide ch. 8.3.2.2).
# proxy_pass has NO trailing URI on purpose: the /dbx prefix is kept, because
# dbx-web runs with DBX_PUBLIC_BASE_PATH=/dbx and expects the full path.
location /dbx/ {
    proxy_pass http://127.0.0.1:18224;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    client_max_body_size 512m;
}
